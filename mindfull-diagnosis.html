<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindFull — 나의 자기 사랑 지수 진단</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --warm-white: #FAF7F2;
    --charcoal: #2C2C2C;
    --soft-charcoal: #4A4A4A;
    --teal: #7AA8A1;
    --teal-light: #A8C5C0;
    --teal-dark: #5A8A83;
    --gold: #C4A882;
    --blush: #E8D5C4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--charcoal);
    color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    line-height: 1.8;
    min-height: 100vh;
  }

  /* SCREENS */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* INTRO */
  #intro {
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }

  #intro::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 65% 35%, rgba(122,168,161,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at 35% 70%, rgba(196,168,130,0.08) 0%, transparent 50%);
    animation: breathe 8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .intro-inner { position: relative; max-width: 500px; }

  .intro-label {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--teal-light);
    text-transform: uppercase;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  .intro-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(30px, 7vw, 56px);
    font-weight: 300;
    line-height: 1.4;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .intro-title em {
    font-style: normal;
    color: var(--teal-light);
  }

  .intro-sub {
    font-size: 14px;
    color: rgba(245,240,232,0.55);
    line-height: 2;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.8s;
  }

  .intro-meta {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .meta-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    color: var(--teal-light);
    font-weight: 300;
  }

  .meta-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
  }

  .start-btn {
    display: inline-block;
    padding: 18px 56px;
    background: var(--teal-light);
    color: var(--charcoal);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    border: none;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.2s;
  }

  .start-btn:hover {
    background: var(--cream);
  }

  /* QUIZ */
  #quiz {
    padding: 0;
    justify-content: flex-start;
  }

  .quiz-header {
    padding: 32px 24px 24px;
    border-bottom: 1px solid rgba(245,240,232,0.08);
    position: sticky;
    top: 0;
    background: var(--charcoal);
    z-index: 10;
  }

  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 600px;
    margin: 0 auto 16px;
  }

  .quiz-brand {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--teal-light);
    text-transform: uppercase;
  }

  .quiz-count {
    font-size: 12px;
    color: rgba(245,240,232,0.4);
  }

  .progress-bar {
    max-width: 600px;
    margin: 0 auto;
    height: 2px;
    background: rgba(245,240,232,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal-light);
    transition: width 0.5s ease;
    border-radius: 2px;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 24px 80px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .question-area {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .question-area.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .question-domain {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .question-text {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 40px;
    color: var(--cream);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    padding: 18px 24px;
    background: rgba(245,240,232,0.04);
    border: 1px solid rgba(245,240,232,0.1);
    color: rgba(245,240,232,0.7);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 300;
    text-align: left;
    cursor: pointer;
    transition: all 0.3s ease;
    line-height: 1.6;
  }

  .option:hover {
    background: rgba(122,168,161,0.1);
    border-color: rgba(122,168,161,0.4);
    color: var(--cream);
  }

  .option.selected {
    background: rgba(122,168,161,0.15);
    border-color: var(--teal-light);
    color: var(--cream);
  }

  .quiz-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 24px;
    background: linear-gradient(to top, var(--charcoal) 80%, transparent);
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .nav-btn {
    padding: 14px 40px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
  }

  .nav-prev {
    background: transparent;
    border: 1px solid rgba(245,240,232,0.15);
    color: rgba(245,240,232,0.4);
  }

  .nav-prev:hover {
    border-color: rgba(245,240,232,0.3);
    color: rgba(245,240,232,0.7);
  }

  .nav-next {
    background: var(--teal-dark);
    color: var(--cream);
  }

  .nav-next:hover { background: var(--teal); }
  .nav-next:disabled {
    background: rgba(245,240,232,0.08);
    color: rgba(245,240,232,0.2);
    cursor: not-allowed;
  }

  /* RESULT */
  #result {
    justify-content: flex-start;
    align-items: center;
    padding: 60px 24px 80px;
    text-align: center;
  }

  .result-inner {
    max-width: 560px;
    width: 100%;
  }

  .result-label {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--teal-light);
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  .result-stage {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(32px, 7vw, 56px);
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.4s;
  }

  .result-stage em {
    font-style: normal;
    color: var(--teal-light);
  }

  .result-tagline {
    font-size: 14px;
    color: rgba(245,240,232,0.5);
    margin-bottom: 48px;
    font-style: italic;
    font-family: 'Noto Serif KR', serif;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.6s;
  }

  .result-score-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 48px;
    border: 1px solid rgba(122,168,161,0.3);
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.7s;
  }

  .result-score-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 52px;
    font-weight: 300;
    color: var(--teal-light);
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-score-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
  }

  .result-desc {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    color: rgba(245,240,232,0.8);
    line-height: 2.2;
    margin-bottom: 16px;
    text-align: left;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.9s;
  }

  .result-quote {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--teal-light);
    font-style: italic;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
  }

  /* COACHING CTA */
  .coaching-cta {
    background: rgba(245,240,232,0.04);
    border: 1px solid rgba(122,168,161,0.2);
    padding: 40px 32px;
    margin-bottom: 32px;
    text-align: left;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.1s;
  }

  .coaching-cta-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .coaching-cta-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .coaching-cta-desc {
    font-size: 14px;
    color: rgba(245,240,232,0.55);
    line-height: 2;
    margin-bottom: 28px;
  }

  .coaching-btn {
    display: inline-block;
    width: 100%;
    text-align: center;
    padding: 16px;
    background: var(--teal-dark);
    color: var(--cream);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
  }

  .coaching-btn:hover {
    background: var(--teal-light);
    color: var(--charcoal);
  }

  .result-retry {
    font-size: 12px;
    color: rgba(245,240,232,0.3);
    cursor: pointer;
    letter-spacing: 1px;
    background: none;
    border: none;
    text-decoration: underline;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.3s;
  }

  .result-retry:hover { color: rgba(245,240,232,0.6); }

  /* DOMAIN BREAKDOWN */
  .domain-breakdown {
    width: 100%;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
  }

  .domain-title {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: left;
  }

  .domain-item {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .domain-name {
    font-size: 12px;
    color: rgba(245,240,232,0.6);
    width: 80px;
    flex-shrink: 0;
    text-align: left;
  }

  .domain-bar {
    flex: 1;
    height: 3px;
    background: rgba(245,240,232,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .domain-fill {
    height: 100%;
    background: var(--teal-light);
    border-radius: 2px;
    width: 0;
    transition: width 1s ease 0.5s;
  }

  .domain-score {
    font-size: 12px;
    color: var(--teal-light);
    width: 30px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .intro-meta { gap: 20px; }
    .quiz-body { padding: 36px 20px 100px; }
    .coaching-cta { padding: 28px 20px; }
    .result-score-box { padding: 24px 36px; }
    #result { padding: 48px 20px 80px; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="intro-inner">
    <p class="intro-label">MindFull Diagnosis</p>
    <h1 class="intro-title">
      나는 지금<br>
      나를 얼마나<br>
      <em>사랑하고 있을까?</em>
    </h1>
    <p class="intro-sub">
      자기 사랑은 타고나는 게 아니에요.<br>
      지금 내가 어디에 있는지 아는 것부터 시작해요.
    </p>
    <div class="intro-meta">
      <div class="meta-item">
        <span class="meta-num">10</span>
        <span class="meta-label">Questions</span>
      </div>
      <div class="meta-item">
        <span class="meta-num">3</span>
        <span class="meta-label">Minutes</span>
      </div>
      <div class="meta-item">
        <span class="meta-num">Free</span>
        <span class="meta-label">무료</span>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">진단 시작하기</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-top">
      <span class="quiz-brand">MindFull</span>
      <span class="quiz-count" id="quiz-count">1 / 10</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 10%"></div>
    </div>
  </div>

  <div class="quiz-body">
    <div class="question-area" id="question-area">
      <div class="question-domain" id="question-domain"></div>
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <div class="quiz-nav">
    <button class="nav-btn nav-prev" id="prev-btn" onclick="prevQuestion()">이전</button>
    <button class="nav-btn nav-next" id="next-btn" onclick="nextQuestion()" disabled>다음</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-inner">
    <p class="result-label">나의 자기 사랑 지수</p>
    <h2 class="result-stage" id="result-stage"></h2>
    <p class="result-tagline" id="result-tagline"></p>
    <div class="result-score-box">
      <div class="result-score-num" id="result-score"></div>
      <div class="result-score-label">Self Love Index</div>
    </div>
    <div class="domain-breakdown">
      <div class="domain-title">영역별 점수</div>
      <div class="domain-item">
        <span class="domain-name">자기 인식</span>
        <div class="domain-bar"><div class="domain-fill" id="bar-1"></div></div>
        <span class="domain-score" id="score-1"></span>
      </div>
      <div class="domain-item">
        <span class="domain-name">자기 언어</span>
        <div class="domain-bar"><div class="domain-fill" id="bar-2"></div></div>
        <span class="domain-score" id="score-2"></span>
      </div>
      <div class="domain-item">
        <span class="domain-name">자기 경계</span>
        <div class="domain-bar"><div class="domain-fill" id="bar-3"></div></div>
        <span class="domain-score" id="score-3"></span>
      </div>
      <div class="domain-item">
        <span class="domain-name">자기 위로</span>
        <div class="domain-bar"><div class="domain-fill" id="bar-4"></div></div>
        <span class="domain-score" id="score-4"></span>
      </div>
    </div>
    <p class="result-desc" id="result-desc"></p>
    <p class="result-quote" id="result-quote"></p>
    <div class="coaching-cta" id="coaching-cta">
      <div class="coaching-cta-label">토닥 커스 코칭</div>
      <div class="coaching-cta-title" id="cta-title"></div>
      <div class="coaching-cta-desc" id="cta-desc"></div>
      <a href="https://cal.com/최지애-yyez0i/" class="coaching-btn" target="_blank">
        무료 상담 신청하기 →
      </a>
    </div>
    <button class="result-retry" onclick="retryQuiz()">다시 진단하기</button>
  </div>
</div>

<script>
const questions = [
  {
    domain: "영역 1 · 자기 인식",
    text: "오늘 내 기분이 어떤지 말할 수 있어요?",
    options: [
      { text: "바로 말할 수 있어요", score: 4 },
      { text: "생각해봐야 알 것 같아요", score: 3 },
      { text: "잘 모르겠어요", score: 2 },
      { text: "기분을 느낄 새가 없어요", score: 1 }
    ]
  },
  {
    domain: "영역 1 · 자기 인식",
    text: "내가 힘들다는 걸 언제 알아채요?",
    options: [
      { text: "힘들 때 바로 알아요", score: 4 },
      { text: "한참 지나고 나서야 알아요", score: 3 },
      { text: "몸이 아프고 나서야 알아요", score: 2 },
      { text: "알아채지 못하는 것 같아요", score: 1 }
    ]
  },
  {
    domain: "영역 1 · 자기 인식",
    text: "내가 진짜 원하는 게 뭔지 알고 있어요?",
    options: [
      { text: "명확하게 알고 있어요", score: 4 },
      { text: "어렴풋이는 알아요", score: 3 },
      { text: "잘 모르겠어요", score: 2 },
      { text: "생각해본 적 없어요", score: 1 }
    ]
  },
  {
    domain: "영역 2 · 자기 언어",
    text: "뭔가 잘 안 됐을 때 나한테 어떻게 말해요?",
    options: [
      { text: "\"괜찮아, 다음엔 잘 될 거야\"", score: 4 },
      { text: "\"그럴 수도 있지\" 하고 넘겨요", score: 3 },
      { text: "\"왜 이것도 못 해\" 하고 자책해요", score: 1 },
      { text: "아무 말도 안 하고 그냥 넘겨요", score: 2 }
    ]
  },
  {
    domain: "영역 2 · 자기 언어",
    text: "나한테 하는 말이 친한 친구한테도 할 수 있는 말이에요?",
    options: [
      { text: "네, 충분히 할 수 있어요", score: 4 },
      { text: "조금 다르긴 한데 비슷해요", score: 3 },
      { text: "친구한테는 절대 못 할 것 같아요", score: 1 },
      { text: "생각해본 적 없어요", score: 2 }
    ]
  },
  {
    domain: "영역 3 · 자기 경계",
    text: "싫은 걸 싫다고 말할 수 있어요?",
    options: [
      { text: "바로 말할 수 있어요", score: 4 },
      { text: "말하긴 하는데 눈치가 보여요", score: 3 },
      { text: "말하고 싶은데 잘 못 해요", score: 2 },
      { text: "거의 말 못 해요", score: 1 }
    ]
  },
  {
    domain: "영역 3 · 자기 경계",
    text: "상대의 기분에 따라 내 하루가 달라져요?",
    options: [
      { text: "거의 영향 안 받아요", score: 4 },
      { text: "조금 영향은 받아요", score: 3 },
      { text: "꽤 많이 달라져요", score: 2 },
      { text: "완전히 달라져요", score: 1 }
    ]
  },
  {
    domain: "영역 3 · 자기 경계",
    text: "내가 원하는 걸 상대한테 말로 표현할 수 있어요?",
    options: [
      { text: "자연스럽게 말할 수 있어요", score: 4 },
      { text: "말하긴 하는데 눈치 봐요", score: 3 },
      { text: "말하고 싶은데 잘 안 돼요", score: 2 },
      { text: "원하는 게 있어도 그냥 참아요", score: 1 }
    ]
  },
  {
    domain: "영역 4 · 자기 위로",
    text: "많이 힘들 때 나한테 뭐라고 해줘요?",
    options: [

const results = {

    quote: "\"나는 이제 나한테 돌아오는 중이에요.\"",

let currentQ = 0;
let answers = new Array(10).fill(null);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const area = document.getElementById('question-area');

  area.classList.remove('visible');
  setTimeout(() => {
    document.getElementById('question-domain').textContent = q.domain;
    document.getElementById('question-text').textContent = q.text;
    document.getElementById('quiz-count').textContent = `${currentQ + 1} / 10`;
    document.getElementById('progress-fill').style.width = `${((currentQ + 1) / 10) * 100}%`;

    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option' + (answers[currentQ] === i ? ' selected' : '');
      btn.textContent = opt.text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });

    document.getElementById('prev-btn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
    document.getElementById('next-btn').disabled = answers[currentQ] === null;
    document.getElementById('next-btn').textContent = currentQ === 9 ? '결과 보기' : '다음';

    area.classList.add('visible');
  }, 200);
}

function selectOption(i) {
  answers[currentQ] = i;
  document.querySelectorAll('.option').forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === i);
  });
  document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  if (currentQ < 9) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function showResult() {
  // 총점 계산
  let total = 0;
  let domainScores = [0, 0, 0, 0];
  let domainCounts = [3, 2, 3, 2];

  answers.forEach((ans, qi) => {
    const score = questions[qi].options[ans].score;
    total += score;
    if (qi < 3) domainScores[0] += score;
    else if (qi < 5) domainScores[1] += score;
    else if (qi < 8) domainScores[2] += score;
    else domainScores[3] += score;
  });

  const maxTotal = 40;
  const percentage = Math.round((total / maxTotal) * 100);

  // 단계 결정
  let stage;
  if (percentage <= 40) stage = 'seed';
  else if (percentage <= 70) stage = 'sprout';
  else stage = 'flower';

  const r = results[stage];

  showScreen('result');

  setTimeout(() => {
    document.getElementById('result-stage').innerHTML = `<em>${r.stage}</em>`;
    document.getElementById('result-tagline').textContent = r.tagline;
    document.getElementById('result-score').textContent = percentage;
    document.getElementById('result-desc').style.whiteSpace = 'pre-line';
    document.getElementById('result-desc').textContent = r.desc;
    document.getElementById('result-quote').textContent = r.quote;
    document.getElementById('cta-title').textContent = r.ctaTitle;
    document.getElementById('cta-desc').style.whiteSpace = 'pre-line';
    document.getElementById('cta-desc').textContent = r.ctaDesc;

    // 영역별 점수
    const domainMaxes = [12, 8, 12, 8];
    domainScores.forEach((s, i) => {
      const pct = Math.round((s / domainMaxes[i]) * 100);
      setTimeout(() => {
        document.getElementById(`bar-${i+1}`).style.width = pct + '%';
        document.getElementById(`score-${i+1}`).textContent = pct + '%';
      }, 300 + i * 150);
    });
  }, 100);
}

function retryQuiz() {
  currentQ = 0;
  answers = new Array(10).fill(null);
  showScreen('intro');
}
